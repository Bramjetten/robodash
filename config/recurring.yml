production:
  heartbeat_monitors:
    class: HeartbeatMonitorsJob
    queue: background
    priority: 1
    schedule: every 10 minutes
  uptime_monitors:
    class: UptimeMonitorsJob
    queue: background
    priority: 1
    schedule: every minute
  aggregate_samples:
    class: AggregateSamplesJob
    queue: background
    priority: 1
    schedule: every 10 minutes
  cleanup_samples:
    class: CleanupSamplesJob
    queue: background
    priority: 1
    schedule: every 10 minutes
  vacuum_databases:
    class: VacuumDatabasesJob
    queue: background
    priority: 1
    # SQLite never shrinks its files on its own; compact them weekly so freed
    # pages (cleared jobs, expired cache, deleted samples) return to disk.
    schedule: "0 3 * * 0" # every Sunday at 03:00
